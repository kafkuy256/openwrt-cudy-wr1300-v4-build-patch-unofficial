name: Build OpenWrt for Cudy WR1300 v4

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Base release. Do not change without an explicit decision.
  OPENWRT_REPO: https://github.com/openwrt/openwrt.git
  OPENWRT_TAG: v25.12.4
  # Release build config used as the starting point for .config
  CONFIG_BUILDINFO_URL: https://downloads.openwrt.org/releases/25.12.4/targets/ramips/mt7621/config.buildinfo
  # Device profile added by patches/mt7621-cudy-wr1300v4.patch
  TARGET: ramips
  SUBTARGET: mt7621
  DEVICE: cudy_wr1300-v4
  DEVICE_CFG: CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_cudy_wr1300-v4=y
  PATCH_FILE: patches/mt7621-cudy-wr1300v4.patch
  PATCH_SHA256: 9f4237358a740aa8e238685fa55ad4a774cfea1eb05be823090934ef3371ecd1

jobs:
  build:
    name: Build ramips/mt7621 cudy_wr1300-v4
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    defaults:
      run:
        working-directory: openwrt
        shell: bash

    steps:
      - name: Check out this repository (patch + workflow)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          echo "=== disk before ==="
          df -h /
          # Preinstalled toolchains / SDK images that an OpenWrt build never needs.
          sudo rm -rf /usr/share/dotnet /usr/local/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/heroku
          sudo rm -rf /opt/az
          sudo rm -rf /opt/hostedtoolcache/emsdk
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          echo "=== disk after ==="
          df -h /

      - name: Install OpenWrt build dependencies
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev \
            python3-setuptools \
            rsync swig unzip zlib1g-dev file wget time
          echo "gcc: $(gcc --version | head -1)"
          echo "gawk: $(gawk --version | head -1)"
          df -h /

      - name: Clone OpenWrt ${{ env.OPENWRT_TAG }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$OPENWRT_TAG" --single-branch "$OPENWRT_REPO" openwrt
          cd openwrt
          echo "tag:    $(git describe --tags --exact-match)"
          echo "commit: $(git rev-parse HEAD)"
          test "$(git describe --tags --exact-match)" = "$OPENWRT_TAG"

      - name: Update and install feeds
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Verify and apply the WR1300 v4 patch
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          actual="$(sha256sum "$PATCH_FILE" | cut -d' ' -f1)"
          echo "$PATCH_FILE sha256: $actual"
          if [ "$actual" != "$PATCH_SHA256" ]; then
            echo "::error::Patch checksum mismatch (expected $PATCH_SHA256)"
            exit 1
          fi
          cd openwrt
          git apply --check --verbose "$GITHUB_WORKSPACE/$PATCH_FILE"
          git apply "$GITHUB_WORKSPACE/$PATCH_FILE"
          echo "=== files touched by the patch ==="
          git status --short
          echo "=== device profile registered ==="
          grep -n 'cudy_wr1300-v4' target/linux/ramips/image/mt7621.mk

      - name: Select only the cudy_wr1300-v4 target
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o .config "$CONFIG_BUILDINFO_URL"
          echo "release config enables $(grep -c '^CONFIG_TARGET_DEVICE_.*=y$' .config) device profiles"

          # Comment out every device selection (and its per-device package line),
          # but keep CONFIG_TARGET_ramips / CONFIG_TARGET_ramips_mt7621.
          # TARGET_ALL_PROFILES=y would re-enable all of them during defconfig.
          sed -i \
            -e 's/^CONFIG_TARGET_ALL_PROFILES=y$/# CONFIG_TARGET_ALL_PROFILES is not set/' \
            -e '/^CONFIG_TARGET_DEVICE_/s/^/#/' \
            .config

          printf '\n%s\n' "$DEVICE_CFG" >> .config

          echo "=== active CONFIG_TARGET lines before make defconfig ==="
          grep '^CONFIG_TARGET' .config

      - name: make defconfig
        run: make defconfig

      - name: Verify .config
        run: |
          set -euo pipefail
          enabled="$(grep '^CONFIG_TARGET_DEVICE_.*=y$' .config || true)"
          if [ "$enabled" != "$DEVICE_CFG" ]; then
            echo "::error::Expected '$DEVICE_CFG' to be the only enabled device profile."
            echo "Enabled profiles:"
            grep '^CONFIG_TARGET_DEVICE_.*=y$' .config || true
            exit 1
          fi
          if ! grep -qx '# CONFIG_TARGET_ALL_PROFILES is not set' .config; then
            echo "::error::CONFIG_TARGET_ALL_PROFILES is still enabled; all devices would be built."
            exit 1
          fi
          {
            echo "### .config verification"
            echo
            echo '```'
            echo "device profile : $DEVICE"
            echo "target         : $TARGET/$SUBTARGET"
            grep -E '^CONFIG_TARGET_(ramips|MULTI_PROFILE|ALL_PROFILES|PER_DEVICE_ROOTFS)' .config || true
            grep '^CONFIG_TARGET_DEVICE_.*=y$' .config
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download sources and build
        run: |
          set -o pipefail
          make -j"$(nproc)" download world 2>&1 | tee build-parallel.log ||
            make -j1 V=s download world 2>&1 | tee build-serial.log

      - name: Collect firmware and verify checksums
        run: |
          set -euo pipefail
          outdir="bin/targets/$TARGET/$SUBTARGET"
          cd "$outdir"
          ls -la
          test -f sha256sums
          ls -1 *sysupgrade.bin *.manifest
          sha256sum -c --ignore-missing sha256sums
          echo "=== sha256sums ==="
          cat sha256sums

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cudy-wr1300-v4-${{ env.OPENWRT_TAG }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*sysupgrade.bin
            openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/*.manifest
            openwrt/bin/targets/${{ env.TARGET }}/${{ env.SUBTARGET }}/sha256sums